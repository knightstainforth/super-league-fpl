name: Refresh standings page

on:
  schedule:
    - cron: "0 11-23 * * 5,6,0,1"
    - cron: "0 8 * * 2"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fetch_and_render.py"
      - "render_frontpage.py"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-standings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate standings page
        run: python3 fetch_and_render.py index.html

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html unchanged - nothing to commit."
          else
            git add index.html
            git commit -m "Refresh standings ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
            echo "Published updated index.html."
          fi
